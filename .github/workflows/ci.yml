name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Directus extension and bootstrap
        run: |
          node --check directus/bootstrap.mjs
          node --check directus/extensions/directus-extension-waslah-lead-agent/dist/index.js

      - name: Validate n8n workflow JSON
        run: node -e "JSON.parse(require('fs').readFileSync('n8n/workflows/lead-agent-directus.json', 'utf8'))"

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker.example config --quiet
